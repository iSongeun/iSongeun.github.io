<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이집사</title>
  <meta name="description" content="보고 있는 집을 지금 살 수 있는지 계산하는 앱, 이집사.">
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f2f4f6; color: #1b2226; }
    main { width: min(560px, calc(100% - 48px)); padding: 48px; border-radius: 28px; background: #fff; box-shadow: 0 18px 55px rgba(27, 34, 38, .08); }
    .mark { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: #2453d8; color: white; font-size: 22px; font-weight: 700; }
    h1 { margin: 22px 0 10px; font-size: 40px; letter-spacing: -.04em; }
    p { margin: 0 0 28px; color: #5c656c; line-height: 1.6; }
    nav { display: flex; flex-wrap: wrap; gap: 12px; }
    a { color: #1739a6; font-weight: 600; text-decoration: none; padding: 10px 14px; border-radius: 12px; background: #edf2ff; }
    footer { margin-top: 34px; font-size: 13px; color: #8a8f96; }
  </style>
</head>
<body>
  <main>
    <div class="mark">집</div>
    <h1>이집사</h1>
    <p>보고 있는 집을 지금 살 수 있는지 계산합니다. 소득과 자산으로 대출 한도, 취득 비용, 월 상환을 확인하고 가능·주의·어려움을 보여 줍니다.</p>
    <nav aria-label="안내">
      <a href="./privacy/">개인정보 처리방침</a>
      <a href="mailto:ezipsa.connection@gmail.com">문의</a>
    </nav>
    <footer>© 2026 이집사</footer>
  </main>
</body>
</html>
